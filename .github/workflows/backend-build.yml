name: Backend build

# Standalone backend artifacts — only on version tags (same tag pattern as Release).
# Full release (extension + app + GitHub Release) runs in release.yml.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: backend-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: backend

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin
        working-directory: backend

      - name: Lipo universal binary
        run: |
          mkdir -p out
          lipo -create \
            backend/target/aarch64-apple-darwin/release/backend \
            backend/target/x86_64-apple-darwin/release/backend \
            -output out/extract-ai-token
          chmod +x out/extract-ai-token
          file out/extract-ai-token

      - uses: actions/upload-artifact@v4
        with:
          name: extract-ai-token-macos
          path: out/extract-ai-token
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        run: cargo build --release
        working-directory: backend

      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item backend\target\release\backend.exe out\extract-ai-token.exe

      - uses: actions/upload-artifact@v4
        with:
          name: extract-ai-token-windows
          path: out/extract-ai-token.exe
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        run: cargo build --release
        working-directory: backend

      - name: Stage binary
        run: |
          mkdir -p out
          cp backend/target/release/backend out/extract-ai-token
          chmod +x out/extract-ai-token
          file out/extract-ai-token

      - uses: actions/upload-artifact@v4
        with:
          name: extract-ai-token-linux
          path: out/extract-ai-token
          if-no-files-found: error
