name: Release

# Production builds (extension zip, extract-ai-token CLI, desktop app) run only on tags.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to create GitHub releases and upload assets

jobs:
  # ─────────────────────────────────────────────
  # 1. Chrome extension (zip)
  # ─────────────────────────────────────────────
  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build & zip
        run: npm run zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          # wxt zip writes to dist/<name>-<version>-chrome.zip
          path: extension/dist/*.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 2. Backend – cross-compile for all platforms
  # ─────────────────────────────────────────────
  backend-macos:
    name: Backend (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: backend

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin
        working-directory: backend

      - name: Create universal binary
        run: |
          lipo -create \
            backend/target/aarch64-apple-darwin/release/backend \
            backend/target/x86_64-apple-darwin/release/backend \
            -output macos-backend
          chmod +x macos-backend

      - uses: actions/upload-artifact@v4
        with:
          name: macos-backend
          path: macos-backend

      # Standalone backend artifact for users who only want the API binary.
      - name: Stage standalone backend zip (macOS)
        run: |
          mkdir -p out
          cp macos-backend out/extract-ai-token
          chmod +x out/extract-ai-token
          zip -j extract-ai-token-backend-macos.zip out/extract-ai-token

      - uses: actions/upload-artifact@v4
        with:
          name: backend-only-macos
          path: extract-ai-token-backend-macos.zip
          if-no-files-found: error

  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        run: cargo build --release
        working-directory: backend

      - uses: actions/upload-artifact@v4
        with:
          name: windows-backend
          path: backend/target/release/backend.exe

      - name: Stage standalone backend zip (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item backend\target\release\backend.exe out\extract-ai-token.exe
          Compress-Archive -Path out\extract-ai-token.exe -DestinationPath extract-ai-token-backend-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: backend-only-windows
          path: extract-ai-token-backend-windows.zip
          if-no-files-found: error

  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        run: cargo build --release
        working-directory: backend

      - uses: actions/upload-artifact@v4
        with:
          name: linux-backend
          path: backend/target/release/backend

      - name: Stage standalone backend tarball (Linux)
        run: |
          mkdir -p out
          cp backend/target/release/backend out/extract-ai-token
          chmod +x out/extract-ai-token
          tar -czf extract-ai-token-backend-linux.tar.gz -C out extract-ai-token

      - uses: actions/upload-artifact@v4
        with:
          name: backend-only-linux
          path: extract-ai-token-backend-linux.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 3. Flutter app – macOS
  # ─────────────────────────────────────────────
  app-macos:
    name: App (macOS)
    runs-on: macos-latest
    needs: backend-macos
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Download macOS backend binary
        uses: actions/download-artifact@v4
        with:
          name: macos-backend
          path: build/

      - name: Make backend executable
        run: chmod +x build/macos-backend

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Build macOS app
        run: flutter build macos --release
        working-directory: app

      - name: Bundle backend into .app
        run: |
          APP=$(ls -dt app/build/macos/Build/Products/Release/*.app | head -1)
          cp build/macos-backend "$APP/Contents/Resources/backend"
          chmod +x "$APP/Contents/Resources/backend"

      - name: Archive .app as zip
        run: |
          APP=$(ls -dt app/build/macos/Build/Products/Release/*.app | head -1)
          APP_NAME=$(basename "$APP" .app)
          cd "$(dirname "$APP")"
          zip -r --symlinks "$OLDPWD/${APP_NAME}-macos.zip" "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: "*-macos.zip"
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 4. Flutter app – Windows
  # ─────────────────────────────────────────────
  app-windows:
    name: App (Windows)
    runs-on: windows-latest
    needs: backend-windows
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Download Windows backend binary
        uses: actions/download-artifact@v4
        with:
          name: windows-backend
          path: build/

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Build Windows app
        run: flutter build windows --release
        working-directory: app

      - name: Bundle backend next to exe
        shell: pwsh
        run: |
          $bundle = "app\build\windows\x64\runner\Release"
          Copy-Item "build\backend.exe" "$bundle\backend.exe"

      - name: Archive bundle as zip
        shell: pwsh
        run: |
          $bundle = "app\build\windows\x64\runner\Release"
          Compress-Archive -Path "$bundle\*" -DestinationPath "extract-ai-token-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: extract-ai-token-windows.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 5. Flutter app – Linux
  # ─────────────────────────────────────────────
  app-linux:
    name: App (Linux)
    runs-on: ubuntu-latest
    needs: backend-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Download Linux backend binary
        uses: actions/download-artifact@v4
        with:
          name: linux-backend
          path: build/

      - name: Make backend executable
        run: chmod +x build/backend

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Build Linux app
        run: flutter build linux --release
        working-directory: app

      - name: Bundle backend next to executable
        run: |
          BUNDLE=app/build/linux/x64/release/bundle
          cp build/backend "$BUNDLE/backend"
          chmod +x "$BUNDLE/backend"

      - name: Archive bundle as tar.gz
        run: |
          tar -czf extract-ai-token-linux.tar.gz \
            -C app/build/linux/x64/release bundle

      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: extract-ai-token-linux.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 6. Create GitHub Release and upload all assets
  # ─────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - extension
      - backend-macos
      - backend-windows
      - backend-linux
      - app-macos
      - app-windows
      - app-linux
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/app-macos/*
            artifacts/app-windows/*
            artifacts/app-linux/*
            artifacts/backend-only-macos/*
            artifacts/backend-only-windows/*
            artifacts/backend-only-linux/*
            artifacts/extension-chrome/*
